name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shelflife_test
          POSTGRES_USER: shelflife
          POSTGRES_PASSWORD: shelflife
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shelflife -d shelflife_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://shelflife:shelflife@localhost:5432/shelflife_test
      TEST_DATABASE_URL: postgres://shelflife:shelflife@localhost:5432/shelflife_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Check formatting
        working-directory: app
        run: bun run format:check

      - name: Lint
        working-directory: app
        run: bun run lint

      - name: Type-check
        working-directory: app
        run: bunx turbo type-check

      - name: Test
        working-directory: app
        run: bun test

      - name: Build
        working-directory: app
        run: bunx turbo build
